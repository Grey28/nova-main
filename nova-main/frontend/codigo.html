<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="512x512" href="./assets/favicon.png">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <title>NovaFit | Verificar código</title>

    <link rel="stylesheet" href="../style/theme.css">
    <link rel="stylesheet" href="../style/auth-pages.css">
    <link rel="stylesheet" href="../style/auth.css">
</head>

<body data-page="verify-code">

    <main class="auth-card">
        <a class="auth-brand" href="index.html" aria-label="Volver a NovaFit">
            <span class="auth-mark">N</span>
            <span class="auth-name">Nova<em>Fit</em></span>
        </a>

        <h1>Verifica tu código</h1>
        <p>
            Hemos enviado un código de 6 dígitos a tu correo electrónico.
            Escríbelo para continuar.
        </p>

        <form id="codeForm" action="verifcodigo.html">

            <div class="codigo" id="codeInputs">
                <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Dígito 1" required>
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 2" required>
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 3" required>
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 4" required>
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 5" required>
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 6" required>
            </div>

            <button type="submit">Verificar código</button>

        </form>

        <div class="auth-switch">
            ¿No recibiste el código?
            <a href="recuperar.html">Reenviar</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="./js/supabase-config.js"></script>
    <script src="./js/supabase-client.js"></script>
    <script src="./js/auth.js"></script>

</body>

</html>
