<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaFit | Nueva contraseña</title>

    <link rel="stylesheet" href="../style/theme.css">
    <link rel="stylesheet" href="../style/auth-pages.css">
    <link rel="stylesheet" href="../style/auth.css">
</head>

<body data-page="reset-password">

    <main class="auth-card">
        <a class="auth-brand" href="index.html" aria-label="Volver a NovaFit">
            <span class="auth-mark">N</span>
            <span class="auth-name">Nova<em>Fit</em></span>
        </a>

        <h1>Nueva contraseña</h1>
        <p>Crea una contraseña segura para proteger tu cuenta de NovaFit.</p>

        <form id="resetForm" action="inicio.html">

            <label for="newPassword">Nueva contraseña</label>
            <input
                id="newPassword"
                name="password"
                type="password"
                placeholder="••••••••"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <label for="confirmPassword">Confirmar contraseña</label>
            <input
                id="confirmPassword"
                name="password_confirmation"
                type="password"
                placeholder="••••••••"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <button type="submit">Guardar cambios</button>

        </form>

        <div class="auth-switch">
            <a href="inicio.html">Volver al inicio de sesión</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="./js/supabase-config.js"></script>
    <script src="./js/supabase-client.js"></script>
    <script src="./js/auth.js"></script>

</body>

</html>
