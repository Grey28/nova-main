<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaFit | Iniciar Sesión</title>

    <link rel="stylesheet" href="../style/inicio.css">
    <link rel="stylesheet" href="../style/auth.css">

</head>

<body data-page="login">

    <div class="login">

        <h1>NovaFit</h1>

        <p class="subtitulo">
            Bienvenido de nuevo. Inicia sesión para continuar.
        </p>

        <form id="loginForm" action="dashboard.html#inicio">

            <label for="loginEmail">Correo electrónico</label>
            <input id="loginEmail" name="email" type="email" placeholder="correo@ejemplo.com" autocomplete="email" required>

            <label for="loginPassword">Contraseña</label>
            <input id="loginPassword" name="password" type="password" placeholder="********" autocomplete="current-password" required>

            <div class="opciones">

                <label>
                    <input type="checkbox">
                    Recordarme
                </label>

                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>

            </div>

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <div class="registro">

            ¿No tienes una cuenta?

            <a href="registro.html">
                Crear cuenta
            </a>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="./js/supabase-config.js"></script>
    <script src="./js/supabase-client.js"></script>
    <script src="./js/auth.js"></script>

</body>

</html>
