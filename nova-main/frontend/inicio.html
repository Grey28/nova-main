<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="512x512" href="./assets/favicon.png">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <title>NovaFit | Iniciar sesión</title>

    <link rel="stylesheet" href="../style/theme.css">
    <link rel="stylesheet" href="../style/auth-pages.css">
    <link rel="stylesheet" href="../style/auth.css">
    <link rel="stylesheet" href="../style/asistente.css">
</head>

<body data-page="login">

    <main class="auth-card">
        <a class="auth-brand" href="index.html" aria-label="Volver a NovaFit">
            <span class="auth-mark">N</span>
            <span class="auth-name">Nova<em>Fit</em></span>
        </a>

        <h1>Bienvenido de nuevo</h1>
        <p>Inicia sesión para continuar con tu plan.</p>

        <form id="loginForm" action="dashboard.html#inicio">

            <label for="loginEmail">Correo electrónico</label>
            <input id="loginEmail" name="email" type="email" placeholder="correo@ejemplo.com" autocomplete="email" required>

            <label for="loginPassword">Contraseña</label>
            <input id="loginPassword" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>

            <div class="opciones">

                <label>
                    <input type="checkbox">
                    Recordarme
                </label>

                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>

            </div>

            <button type="submit">Iniciar sesión</button>

        </form>

        <div class="auth-switch">
            ¿No tienes una cuenta?
            <a href="registro.html">Crear cuenta</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="./js/supabase-config.js"></script>
    <script src="./js/supabase-client.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/asistente.js"></script>

</body>

</html>
